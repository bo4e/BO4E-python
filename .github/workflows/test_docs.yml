name: "Test Doc Creation (Sphinx)"
on: [push]

jobs:
  docbuild:
    name: Check Docs
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ["3.12"]
        os: [ubuntu-latest]
    env:
      # bo4e CLI only reads GITHUB_ACCESS_TOKEN, not GITHUB_TOKEN. Required so
      # the documentation asset script (bo4e repo versions, bo4e pull) doesn't
      # hit GitHub's 60 req/hr anonymous rate limit.
      GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # Install a specific version of uv.
          version: "0.11.28"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Run kroki with docker
        run: |
          docker compose up -d
      - name: Install bo4e CLI
        uses: ./.github/actions/setup-bo4e
      - name: Sync dependencies
        run: uv sync --group docs
      - name: Build JSON Schemas
        run: uv run python generate_or_validate_json_schemas.py --mode generate
      - name: Generate documentation assets
        run: uv run python scripts/generate_docs_assets.py
      - name: Build the documentation
        run: uv run sphinx-build -T -W -b html -d /tmp/bo4e-docs-doctrees docs /tmp/bo4e-docs-html
      - name: Check README doctest
        run: uv run python -m doctest README.rst
