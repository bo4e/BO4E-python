name: "Coverage"

on: [push]

jobs:
  coverage:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ["3.12"]
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # Install a specific version of uv.
          version: "0.11.28"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --group coverage
      - name: Run Tests and Record Coverage
        run: |
          uv run coverage run -m pytest
          uv run coverage html --omit tests/*,generate_or_validate_json_schemas.py,scripts/*
          uv run coverage report --fail-under 99 --omit tests/*,generate_or_validate_json_schemas.py,scripts/*
